name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    needs: [versioning]
    permissions:
      contents: read
    #Feature ref validates the reusable Compose path before its v1 release; switch back after merge.
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@f2calv/2026-09-compose-test-services
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: redis-dotnet.slnx
      test-compose-file: docker-compose.yml
      test-compose-services: '["redis"]'

  release:
    needs: [lint, versioning, build]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
